<title>Terrarium Leitstand</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Leitstand: dunkle Seitenleiste wie in einer Steuerzentrale, ruhige Arbeitsfläche rechts.
   Gebaut für das iPad im Querformat, darunter wird die Seitenleiste zur Tab-Leiste unten. */
:root {
  --bg: #FBF6F1; --surface: #FFFFFF; --surface2: #FDF9F6; --line: #EBDFD6; --line2: #F3EAE3; --fg: #3B2F34; --muted: #7B6B70; --faint: #A99B9F;
  --side: #F7EAE5; --side2: rgba(255, 255, 255, 0.62); --sidefg: #4A3A40; --sidemuted: #8C777D; --sideline: #EAD6CF;
  --ac: #9A6B1B; --acfg: #3A2A0E; --acsoft: #FAF0D9;
  --gold1: #F0D48A; --gold2: #D4A94F; --gold3: #B98A2E; --rose1: #F4D2D0; --rose2: #D98E9B; --rose3: #B76E79; --silver1: #ECEEF2; --silver2: #BFC4CD; --silver3: #8D94A0;
  --kn: #B5607C; --jc: #B98A2E; --rg: #7C8794; --ot: #8A7BA8;
  --g: #3E9A6B; --gs: #E6F3EC; --gt: #1F5A3D; --y: #C08F00; --ys: #FBF1D0; --yt: #5E4600; --o: #E0701C; --os: #FDE9DA; --otx: #8A3500; --r: #D23B3B; --rs: #FBE3E3; --rt: #7C1414; --n: #9A9099; --ns: #F3EEF0; --nt: #5C5258;
  --track: rgba(90, 60, 50, 0.09); --zone: rgba(62, 154, 107, 0.22); --band: rgba(62, 154, 107, 0.11); --night: rgba(120, 110, 150, 0.07); --shadow: 0 1px 2px rgba(120, 80, 60, 0.06), 0 8px 24px rgba(184, 138, 90, 0.10);
  --sans: "Jost", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; --serif: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #151D1A; --surface2: #19221F; --line: #26322D; --line2: #1F2925; --fg: #E6EEEA; --muted: #98A9A2; --faint: #6E7F78;
  --side: #0A0F0D; --side2: #121A17; --sidefg: #E3ECE8; --sidemuted: #8FA39B; --sideline: #1E2925;
  --ac: #E6C879; --acfg: #2A1D08; --acsoft: #3A2F1A;
  --kn: #E59AB0; --jc: #E6C879; --rg: #B9C0CC; --ot: #B9A8D8;
  --g: #45D58E; --gs: #133325; --gt: #9CF0C6; --y: #F0CF4A; --ys: #322B0E; --yt: #F8E59A; --o: #FF9C4A; --os: #3A2312; --otx: #FFC796; --r: #FF6464; --rs: #3B1717; --rt: #FFB0B0; --n: #7E8E96; --ns: #1E2724; --nt: #BCC8CE;
  --track: rgba(230, 238, 234, 0.08); --zone: rgba(69, 213, 142, 0.28); --band: rgba(69, 213, 142, 0.12); --night: rgba(130, 150, 190, 0.08); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ac); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 22px; } h2 { font-size: 17px; } h3 { font-size: 15px; } h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
p { margin: 0; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .xs { font-size: 12.5px; color: var(--muted); } .sm { font-size: 13.5px; }
.row { display: flex; align-items: center; gap: 10px; } .wrap { flex-wrap: wrap; } .col { display: flex; flex-direction: column; gap: 4px; } .grow { flex: 1; min-width: 0; } .between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.sp-kn { --sp: var(--kn); } .sp-jc { --sp: var(--jc); } .sp-rg { --sp: var(--rg); } .sp-other { --sp: var(--ot); }
.lv-green { --lc: var(--g); --ls: var(--gs); --lt: var(--gt); } .lv-yellow { --lc: var(--y); --ls: var(--ys); --lt: var(--yt); } .lv-orange { --lc: var(--o); --ls: var(--os); --lt: var(--otx); } .lv-red { --lc: var(--r); --ls: var(--rs); --lt: var(--rt); } .lv-none { --lc: var(--n); --ls: var(--ns); --lt: var(--nt); }

/* Rahmen */
.shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.side { display: none; }
.main { min-width: 0; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 12px; }
.topbar .title { flex: 1; min-width: 0; }
.topbar h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.content { padding: 18px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 18px; max-width: 1400px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--side); border-top: 1px solid var(--sideline); padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { background: none; border: 0; color: var(--sidemuted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; padding: 6px 2px; border-radius: 10px; position: relative; cursor: pointer; min-height: 48px; }
.tabbar button.on { color: var(--sidefg); background: var(--side2); }
.cnt { position: absolute; top: 2px; right: calc(50% - 22px); background: var(--o); color: #1a0c00; font: 600 10.5px/16px var(--mono); min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px; text-align: center; }
@media (min-width: 900px) {
  .shell { grid-template-columns: 252px 1fr; }
  .side { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); color: var(--sidefg); padding: 18px 12px 18px max(12px, env(safe-area-inset-left)); gap: 18px; }
  .main { padding-bottom: 24px; }
  .tabbar { display: none; }
  .topbar { padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right)); }
  .content { padding: 22px max(24px, env(safe-area-inset-right)) 32px 24px; }
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
.brand .mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #2FA77B, #1B5E47); display: grid; place-items: center; color: #fff; }
.brand b { display: block; font-size: 15px; } .brand span { font-size: 11.5px; color: var(--sidemuted); }
.snav { display: flex; flex-direction: column; gap: 2px; }
.snav button { display: flex; align-items: center; gap: 11px; width: 100%; background: none; border: 0; color: var(--sidemuted); padding: 9px 10px; border-radius: 9px; font-size: 14.5px; font-weight: 500; cursor: pointer; text-align: left; position: relative; }
.snav button:hover { background: var(--side2); color: var(--sidefg); }
.snav button.on { background: var(--side2); color: var(--sidefg); box-shadow: inset 3px 0 0 #3CC08F; }
.snav .badge-n { margin-left: auto; background: var(--o); color: #1a0c00; font: 600 11px/18px var(--mono); padding: 0 6px; border-radius: 9px; }
.side h4 { color: var(--sidemuted); padding: 0 10px; font-size: 11px; }
.sterr { display: flex; flex-direction: column; gap: 4px; }
.sterr button { display: grid; grid-template-columns: 10px 1fr; column-gap: 10px; align-items: center; background: none; border: 1px solid transparent; color: var(--sidefg); padding: 8px 10px; border-radius: 10px; cursor: pointer; text-align: left; }
.sterr button:hover, .sterr button.on { background: var(--side2); border-color: var(--sideline); }
.sterr .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lc) 25%, transparent); }
.sterr .nm { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sterr .vals { grid-column: 2; font: 12px var(--mono); color: var(--sidemuted); }
.side .foot { margin-top: auto; font-size: 11.5px; color: var(--sidemuted); padding: 0 10px; display: flex; flex-direction: column; gap: 6px; }

/* Bausteine */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2, .card-h h3 { flex: 1; min-width: 0; }
.grid { display: grid; gap: 16px; }
.g-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: 1fr; }
.g-2 { grid-template-columns: 1fr; }
@media (min-width: 700px) { .g-kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g-2w { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--lc); }
.kpi .lab { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.kpi .val { font: 600 28px/1.1 var(--mono); letter-spacing: -0.02em; }
.kpi .val small { font-size: 15px; color: var(--muted); font-weight: 500; }
.kpi .sub { font-size: 12.5px; color: var(--muted); }
button.kpi { text-align: left; cursor: pointer; font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--fg) 25%, var(--line)); }
.btn.pri { background: var(--ac); border-color: var(--ac); color: var(--acfg); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { min-height: 34px; padding: 0 11px; font-size: 13px; border-radius: 9px; }
.btn.danger { color: var(--r); }
.btn.dangerfill { background: var(--r); border-color: var(--r); color: #fff; }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .snav button:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--ls); color: var(--lt); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lc); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.sptag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.sptag::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--sp); }
.store { font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.store i { width: 7px; height: 7px; border-radius: 50%; background: var(--lc); }
.seg { display: inline-flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { background: none; border: 0; padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
a.btn { text-decoration: none; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; margin: -4px 0 0; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 11px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--sp, var(--ac)); }
.tabs .cnt2 { font: 600 11px/17px var(--mono); padding: 0 6px; border-radius: 9px; background: var(--os); color: var(--otx); }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line2); min-width: 0; }
.li:first-child { border-top: 0; }
.li .ic { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--ls, var(--surface2)); color: var(--lc, var(--muted)); display: grid; place-items: center; }
.li .main-t { font-weight: 600; font-size: 14.5px; }
.li .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.li.stackm { flex-wrap: wrap; }
.quick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--ys); color: var(--yt); border-radius: 10px; padding: 8px 10px; width: 100%; margin-top: 6px; font-size: 13.5px; }
.li .quick input { width: 110px; min-height: 34px; padding: 4px 10px; }
.li .quick input[type="date"] { width: 160px; }
.bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lc); border-radius: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); }
@media (min-width: 900px) { .toast { bottom: 28px; left: calc(50% + 126px); } }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: var(--ls); color: var(--lt); font-size: 14px; }
.banner .grow { min-width: 200px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--rs); color: var(--rt); padding: 8px 10px; border-radius: 10px; font-size: 13.5px; }

/* Terrarium-Kacheln */
.tpanel { display: flex; flex-direction: column; gap: 12px; border-top: 4px solid var(--sp); }
.tpanel .hd { display: flex; align-items: flex-start; gap: 10px; }
.rings { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ringbox { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ringbox svg { width: 100%; max-width: 132px; height: auto; }
.ringbox .cap { font-size: 12px; color: var(--muted); text-align: center; }
.ring-track { fill: none; stroke: var(--track); stroke-width: 9; stroke-linecap: round; }
.ring-zone { fill: none; stroke: var(--zone); stroke-width: 9; stroke-linecap: butt; }
.ring-val { fill: none; stroke: var(--lc); stroke-width: 9; stroke-linecap: round; }
.ring-dot { fill: var(--surface); stroke: var(--lc); stroke-width: 3; }
.ring-num { fill: var(--fg); font-family: var(--mono); font-weight: 600; text-anchor: middle; }
.ring-unit { fill: var(--muted); font-size: 10px; text-anchor: middle; font-family: var(--sans); }
.sparks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.spark { width: 100%; height: 38px; display: block; }
.spark-l { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.big-rings .ringbox svg { max-width: 190px; }
.targets { display: grid; grid-template-columns: auto auto auto; justify-content: space-between; gap: 4px 12px; font-size: 13px; align-items: center; background: var(--surface2); border-radius: 10px; padding: 8px 12px; }
.targets .ph { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.targets .ph.on { color: var(--sp, var(--ac)); }
.targets .num { white-space: nowrap; }
.lgrid { display: grid; gap: 10px; }
.lrow { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; }
.lrow .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--surface2); color: var(--sp, var(--muted)); display: grid; place-items: center; }
.lrow b { display: block; font-size: 13.5px; }
.lrow p { font-size: 13.5px; }
.uvi { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.uvi .tag { white-space: normal; }

/* Diagramm */
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--mono); }
.readout { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 8px 12px; background: var(--surface2); border-radius: 10px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 700px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font: 600 18px var(--mono); }

/* Tabellen */
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 8px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.tbl-wrap { overflow-x: auto; }

/* Formulare */
.form { display: flex; flex-direction: column; gap: 16px; }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
legend { font-weight: 600; font-size: 14px; padding: 0 6px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
input[type="text"], input[type="date"], input[type="time"], input[type="datetime-local"], input:not([type]), select, textarea { width: 100%; min-height: 42px; padding: 8px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 15px; font-weight: 500; }
input.num-in { font-family: var(--mono); }
textarea { min-height: 76px; resize: vertical; }
.f-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.f-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 700px) { .f-grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; } }
@media (max-width: 699px) { .f-grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
.ferr { display: block; color: var(--r); font-size: 12.5px; font-weight: 600; }
.has-err input, .has-err select { border-color: var(--r); }
.hint { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.src { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.src a { word-break: break-word; }
.zt { table-layout: fixed; }
.zt th:first-child, .zt td:first-child { width: 58px; }
.zt th { white-space: normal; text-align: center; padding: 6px 4px; }
.zt td { padding: 6px 4px; }
.zt td input { min-height: 38px; text-align: center; padding: 6px 4px; }
.zt td:first-child { font-weight: 600; }
.sizebox { padding: 12px 14px; border-radius: 10px; background: var(--ls); color: var(--lt); font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
.steppers { display: flex; gap: 6px; align-items: center; }
.steppers input { text-align: center; font: 600 22px var(--mono); min-height: 52px; }
.steppers .btn { min-width: 52px; min-height: 52px; font-size: 18px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
.chip.on { background: var(--acsoft); border-color: var(--ac); color: var(--fg); }

<div id="app" aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="logic.js"></script>
<script>
(function () {
  'use strict';
  const TL = window.TL;
  const $app = document.getElementById('app');

  /* ================= Zustand ================= */
  const S = {
    docs: {}, ver: 0, demo: false, demoDocs: null,
    view: 'dash', tab: 'klima', tid: null, aid: null,
    chartKind: 't', chartRange: '7', taskFilter: 'all', lampFilter: 'all',
    edit: null, pf: null, errors: {}, confirm: null, entry: null,
    ready: false, pendingRender: false, exportText: null, importDocs: null, sensor: [], devices: null
  };

  const clone = o => JSON.parse(JSON.stringify(o));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = TL.fmt;
  const now = () => Date.now();
  const rank = l => TL.LEVELS.indexOf(l || 'none');

  function docs() { return S.demo ? S.demoDocs : S.docs; }
  function cfg() { return docs().config; }
  function terrs() { return cfg().terrariums; }
  function terr(id) { return terrs().find(t => t.id === id) || terrs()[0]; }
  function lamps() { return cfg().lamps || []; }
  function tasks() { return cfg().tasks || []; }
  function animals() { return cfg().animals || []; }

  let cacheVer = -1, cacheR = [], cacheJ = [];
  function bump() { S.ver++; }
  function refresh() {
    const key = S.ver * 2 + (S.demo ? 1 : 0);
    if (cacheVer === key) return;
    cacheR = S.demo || !S.sensor.length ? TL.collectReadings(docs()) : TL.collectReadings(docs()).concat(S.sensor).sort((a, b) => a.ts - b.ts); cacheJ = TL.collectJournal(docs()); cacheVer = key;
  }
  function allReadings() { refresh(); return cacheR; }
  function allJournal() { refresh(); return cacheJ; }
  function readingsOf(tid) { return allReadings().filter(r => r.tid === tid); }
  function lastReading(tid) { const r = readingsOf(tid); return r.length ? r[r.length - 1] : null; }

  /* ================= Speicher ================= */
  const LKEY = 'tcc.v1.docs';
  function readLocal() { try { const s = localStorage.getItem(LKEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function writeLocal() { try { localStorage.setItem(LKEY, JSON.stringify(S.docs)); return true; } catch (e) { return false; } }
  function localOk() { try { localStorage.setItem('tcc.probe', '1'); localStorage.removeItem('tcc.probe'); return true; } catch (e) { return false; } }

  /* Supabase-Betrieb: nur in der eigenständigen Web-App, wenn config.js die Verbindung setzt */
  const SUPA = window.TCC_SUPABASE && window.supabase ? window.TCC_SUPABASE : null;
  let sb = null, sbUid = null;
  const sensorRow = x => ({ id: 's' + x.id, sid: x.id, tid: x.tid, ts: Date.parse(x.ts), t: x.t === null ? null : Number(x.t), h: x.h === null ? null : Number(x.h), src: 'sensor', battery: x.battery, n: '' });

  const Store = {
    mode: 'loading', col: null, queue: {},
    async init() {
      if (SUPA) {
        sb = window.supabase.createClient(SUPA.url, SUPA.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
        const { data } = await sb.auth.getSession();
        if (!data.session) { this.mode = 'login'; return; }
        return this.loadSupa(data.session.user.id);
      }
      const local = readLocal();
      let db = null, user = null, id = null;
      if (window.claude && typeof window.claude.use === 'function') {
        try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { db = null; }
        if (db && user) { try { id = await user.id(); } catch (e) { id = null; } }
      }
      if (db && id) {
        try {
          this.col = db.collection('data/users/' + id);
          const snap = await this.col.get();
          const d = {};
          snap.docs.forEach(s => { if (s.exists) d[s.id] = clone(s.data()); });
          if (!d.config && local && local.config) {
            for (const [k, v] of Object.entries(local)) { await this.col.doc(k).set(v); d[k] = v; }
            S.movedLocal = true;
          }
          S.docs = d; this.mode = 'cloud';
          this.subscribe();
          return;
        } catch (e) { this.col = null; }
      }
      this.mode = localOk() ? 'local' : 'memory';
      S.docs = local || {};
    },
    async loadSupa(uid) {
      sbUid = uid;
      const { data, error } = await sb.from('app_docs').select('key, body');
      if (error) { this.mode = 'memory'; S.docs = {}; toast('Supabase nicht erreichbar: ' + error.message); return; }
      const d = {}; data.forEach(x => { d[x.key] = x.body; });
      S.docs = d;
      const since = new Date(now() - 400 * TL.DAY).toISOString();
      const all = []; let from = 0;
      for (;;) {
        const res = await sb.from('sensor_readings').select('id, tid, ts, t, h, battery').gte('ts', since).order('ts').range(from, from + 999);
        if (res.error || !res.data.length) break;
        all.push(...res.data.map(sensorRow)); if (res.data.length < 1000) break; from += 1000;
      }
      S.sensor = all;
      this.mode = 'supa';
      sb.channel('tcc').on('postgres_changes', { event: '*', schema: 'public', table: 'app_docs', filter: 'user_id=eq.' + uid }, ev => {
        if (ev.eventType === 'DELETE') { const k = ev.old && ev.old.key; if (k && S.docs[k]) { delete S.docs[k]; } }
        else if (JSON.stringify(S.docs[ev.new.key]) !== JSON.stringify(ev.new.body)) S.docs[ev.new.key] = ev.new.body; else return;
        if (!S.demo) { prepareConfig(); bump(); softRender(); }
      }).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sensor_readings', filter: 'user_id=eq.' + uid }, ev => {
        S.sensor.push(sensorRow(ev.new)); bump(); if (!S.demo) softRender();
      }).subscribe();
    },
    subscribe() {
      this.col.onSnapshot(snap => {
        let changed = false;
        for (const ch of snap.docChanges()) {
          if (ch.doc.metadata.hasPendingWrites) continue;
          if (ch.type === 'removed') { if (S.docs[ch.doc.id]) { delete S.docs[ch.doc.id]; changed = true; } }
          else {
            const body = clone(ch.doc.data());
            if (JSON.stringify(S.docs[ch.doc.id]) !== JSON.stringify(body)) { S.docs[ch.doc.id] = body; changed = true; }
          }
        }
        if (changed && !S.demo) { prepareConfig(); bump(); softRender(); }
      }, err => { if (err && err.code === 'revoked') { Store.mode = 'memory'; softRender(); } });
    },
    put(key, body) {
      if (S.demo) { S.demoDocs[key] = body; bump(); return Promise.resolve(); }
      S.docs[key] = body; bump();
      if (this.mode === 'cloud') return this.enqueue(key, () => this.col.doc(key).set(body));
      if (this.mode === 'supa') return this.enqueue(key, () => sb.from('app_docs').upsert({ user_id: sbUid, key, body }).then(r => { if (r.error) throw r.error; }));
      if (this.mode === 'local' && !writeLocal()) toast('Speichern im Browser fehlgeschlagen. Exportiere ein Backup.');
      return Promise.resolve();
    },
    remove(key) {
      if (S.demo) { delete S.demoDocs[key]; bump(); return Promise.resolve(); }
      delete S.docs[key]; bump();
      if (this.mode === 'cloud') return this.enqueue(key, () => this.col.doc(key).delete());
      if (this.mode === 'supa') return this.enqueue(key, () => sb.from('app_docs').delete().eq('user_id', sbUid).eq('key', key).then(r => { if (r.error) throw r.error; }));
      if (this.mode === 'local') writeLocal();
      return Promise.resolve();
    },
    enqueue(key, fn) {
      const run = () => fn().catch(e => {
        if (e && e.code === 'unavailable') return new Promise(r => setTimeout(r, 600 + Math.random() * 600)).then(fn);
        throw e;
      });
      const p = (this.queue[key] || Promise.resolve()).then(run).catch(e => {
        toast(e && e.code === 'quota_exceeded' ? 'Speicher voll. Lösche alte Messwerte oder exportiere ein Backup.' : 'Speichern fehlgeschlagen. Prüfe deine Verbindung und versuche es erneut.');
      });
      this.queue[key] = p;
      return p;
    }
  };

  /* Legt Einstellungen an oder bringt alte auf den neuen Stand. Gibt true zurück, wenn ergänzt wurde. */
  function prepareConfig() {
    if (!S.docs.config) { S.docs.config = TL.defaultConfig(); Store.put('config', S.docs.config); return false; }
    const c = clone(S.docs.config);
    if (TL.migrateConfig(c)) { Store.put('config', c); return true; }
    return false;
  }
  function saveConfig(c) { return Store.put('config', c); }

  /* ================= Änderungen ================= */
  function addReading(tid, v, note) {
    const key = TL.readingDocKey(tid, v.ts);
    const d = clone(docs()[key] || { tid, month: TL.monthKey(v.ts), rows: [] });
    d.rows.push({ id: TL.uid('m'), ts: v.ts, t: v.t, h: v.h, src: 'manual', n: note || '' });
    d.rows.sort((a, b) => a.ts - b.ts);
    return Store.put(key, d);
  }
  function deleteReading(r) {
    if (r.src === 'sensor' && sb) {
      S.sensor = S.sensor.filter(x => x.id !== r.id); bump();
      return sb.from('sensor_readings').delete().eq('id', r.sid).then(res => { if (res.error) toast('Löschen fehlgeschlagen'); });
    }
    const key = TL.readingDocKey(r.tid, r.ts);
    const d = docs()[key]; if (!d) return;
    const nd = clone(d); nd.rows = nd.rows.filter(x => x.id !== r.id);
    return nd.rows.length ? Store.put(key, nd) : Store.remove(key);
  }
  function addJournal(e) {
    const key = TL.journalDocKey(e.ts);
    const d = clone(docs()[key] || { year: new Date(e.ts).getFullYear(), rows: [] });
    d.rows.push(e);
    return Store.put(key, d);
  }
  function deleteJournal(e) {
    const key = TL.journalDocKey(e.ts);
    const d = docs()[key]; if (!d) return;
    const nd = clone(d); nd.rows = nd.rows.filter(x => x.id !== e.id);
    return nd.rows.length ? Store.put(key, nd) : Store.remove(key);
  }

  /* ================= Auswertung ================= */
  function assessOf(t) { return TL.assessTerrarium(t, lastReading(t.id), now()); }
  function taskList(tid) {
    return tasks().filter(k => !tid || tid === 'all' || k.tid === tid)
      .map(k => ({ k, d: TL.dueInfo(k, now(), cfg().settings?.dueSoonDays) }))
      .sort((a, b) => (a.d.daysLeft ?? 99999) - (b.d.daysLeft ?? 99999));
  }
  function lampList(tid) {
    return lamps().filter(l => !tid || tid === 'all' || l.tid === tid)
      .map(l => ({ l, i: TL.lampInfo(l, now()) }))
      .sort((a, b) => (a.i.daysLeft ?? 99999) - (b.i.daysLeft ?? 99999));
  }
  const urgent = l => l === 'orange' || l === 'red';
  function climateIssues() { return terrs().map(t => ({ t, a: assessOf(t) })).filter(x => rank(x.a.level) >= rank('yellow')); }
  function counts() {
    const tl = taskList(), ll = lampList();
    return {
      tasksDue: tl.filter(x => urgent(x.d.level)).length,
      tasksSoon: tl.filter(x => x.d.level === 'yellow').length,

  const lampIcon = l => (TL.LAMP_TYPES[l.type] || {}).group === 'uvb' ? 'uvb' : 'lamp';

  function pill(level, text) { return '<span class="pill ' + lvl(level) + '">' + esc(text || TL.LEVEL_INFO[level].label) + '</span>'; }
  function ageText(ts) {
    const m = Math.round((now() - ts) / 60000);

  function dateTime(ts) {

  function dayTxt(iso) { const t = Date.parse(iso); return Number.isFinite(t) ? dateLong(t) : '–'; }
  function rangeTxt(r, unit) { return TL.rangeSet(r) ? fmt(r.min, unit === '%' ? 0 : 1) + '–' + fmt(r.max, unit === '%' ? 0 : 1) + ' ' + unit : 'nicht festgelegt'; }
  function numStr(v, d) { return v === null || v === undefined || v === '' ? '' : fmt(v, d).replace(/\./g, '').replace(/,0$/, ''); }
  function terrName(tid) { const t = terrs().find(x => x.id === tid); return t ? t.name : 'Ohne Terrarium'; }

  function ring(o) {
    const cx = 60, cy = 60, R = 46, start = 135, sweep = 270;
    const pol = deg => { const a = deg * Math.PI / 180; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; };
    const arc = (a0, a1) => { const [x0, y0] = pol(a0), [x1, y1] = pol(a1); return 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + R + ' ' + R + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2); };
    const f = v => Math.max(0, Math.min(1, (v - o.lo) / (o.hi - o.lo)));
    let s = '<svg viewBox="0 0 120 108" role="img" aria-label="' + esc(o.aria) + '" class="' + lvl(o.level) + '">';
    s += '<path class="ring-track" d="' + arc(start, start + sweep) + '"/>';
    if (o.range && TL.rangeSet(o.range)) s += '<path class="ring-zone" d="' + arc(start + sweep * f(o.range.min), start + sweep * f(o.range.max)) + '"/>';

  function ringsFor(t, a, r) {

    const tv = r ? r.t : null, hv = r ? r.h : null;
    const tlo = Math.min(TL.rangeSet(tr) ? tr.min - 6 : 15, Number.isFinite(tv) ? tv - 2 : 99), thi = Math.max(TL.rangeSet(tr) ? tr.max + 6 : 35, Number.isFinite(tv) ? tv + 2 : -99);

      '<div class="ringbox">' + ring({ value: tv, range: tr, lo: tlo, hi: thi, unit: '°C', level: a.temp.level, digits: 1, aria: 'Temperatur ' + (Number.isFinite(tv) ? fmt(tv) + ' Grad' : 'kein Wert') }) + '<span class="cap">' + (a.phase === 'night' ? 'Ziel Nacht ' : 'Ziel Tag ') + rangeTxt(tr, '°C') + '</span></div>' +
      '<div class="ringbox">' + ring({ value: hv, range: hr, lo: 0, hi: 100, unit: '% rF', level: a.hum.level, digits: 0, aria: 'Luftfeuchte ' + (Number.isFinite(hv) ? fmt(hv, 0) + ' Prozent' : 'kein Wert') }) + '<span class="cap">' + (a.phase === 'night' ? 'Ziel Nacht ' : 'Ziel Tag ') + rangeTxt(hr, '%') + '</span></div></div>';
  }
  function spark(rows, kind) {
    const pts = rows.filter(r => Number.isFinite(r[kind]));
    if (pts.length < 2) return '<div class="spark xs" style="display:flex;align-items:center">Noch kein Verlauf</div>';
    const W = 200, H = 38, x0 = pts[0].ts, x1 = pts[pts.length - 1].ts;
    const vs = pts.map(p => p[kind]); const lo = Math.min(...vs), hi = Math.max(...vs); const span = hi - lo || 1;
    const X = ts => ((ts - x0) / (x1 - x0 || 1)) * (W - 6) + 3, Y = v => H - 4 - ((v - lo) / span) * (H - 10);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.ts).toFixed(1) + ' ' + Y(p[kind]).toFixed(1)).join(' ');

  }

  let chartState = null;
  function chartSvg(t, rows, kind, from, to) {
    const W = 720, H = 250, L = 36, R = 10, T = 10, B = 26;
    const key = kind === 't' ? 'temp' : 'hum';
    const unit = kind === 't' ? '°C' : '%';
    const pts = rows.filter(r => Number.isFinite(r[kind]) && r.ts >= from && r.ts <= to);
    const samples = [];
    const step = Math.max(15 * 60000, (to - from) / 300);
    for (let ts = from; ts <= to; ts += step) samples.push({ ts, ...TL.rangesAt(t, ts) });
    let vals = pts.map(p => p[kind]);
    samples.forEach(s => { const r = s[key]; if (TL.rangeSet(r)) vals.push(r.min, r.max); });
    if (!vals.length) vals = kind === 't' ? [20, 30] : [40, 80];
    let lo = Math.floor(Math.min(...vals) - (kind === 't' ? 1 : 5)), hi = Math.ceil(Math.max(...vals) + (kind === 't' ? 1 : 5));
    if (kind === 'h') { lo = Math.max(0, lo); hi = Math.min(100, hi); }
    if (hi - lo < 4) hi = lo + 4;
    const X = ts => L + (ts - from) / (to - from) * (W - L - R);
    const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Verlauf ' + (kind === 't' ? 'Temperatur' : 'Luftfeuchte') + '">';
    let nStart = null;
    samples.forEach((smp, i) => {
      const isN = smp.phase === 'night';
      if (isN && nStart === null) nStart = smp.ts;
      if ((!isN || i === samples.length - 1) && nStart !== null) {
        const end = isN ? to : smp.ts;
        s += '<rect x="' + X(nStart).toFixed(1) + '" y="' + T + '" width="' + Math.max(0, X(end) - X(nStart)).toFixed(1) + '" height="' + (H - T - B) + '" fill="var(--night)"/>';
        nStart = null;
      }
    });
    for (let i = 0; i <= 4; i++) {
      const v = lo + (hi - lo) * i / 4, y = Y(v);
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--line2)" stroke-width="1"/>';
      s += '<text x="' + (L - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + fmt(v, 0) + '</text>';
    }
    const segs = []; let cur = [];
    samples.forEach(smp => { const r = smp[key]; if (TL.rangeSet(r)) cur.push({ ts: smp.ts, r }); else if (cur.length) { segs.push(cur); cur = []; } });
    if (cur.length) segs.push(cur);
    segs.forEach(seg => {
      const top = seg.map((p, i) => (i ? 'L' : 'M') + X(p.ts).toFixed(1) + ' ' + Y(Math.min(hi, p.r.max)).toFixed(1)).join(' ');
      const bot = seg.slice().reverse().map(p => 'L' + X(p.ts).toFixed(1) + ' ' + Y(Math.max(lo, p.r.min)).toFixed(1)).join(' ');
      s += '<path d="' + top + ' ' + bot + ' Z" fill="var(--band)" stroke="none"/>';
    });
    const days = (to - from) / TL.DAY;
    const xt = days <= 1.1 ? 8 : days <= 8 ? 7 : 6;
    for (let i = 0; i <= xt; i++) {
      const ts = from + (to - from) * i / xt;
      const d = new Date(ts);
      const lab = days <= 1.1 ? d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
      s += '<text x="' + X(ts).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? 'start' : i === xt ? 'end' : 'middle') + '">' + lab + '</text>';
    }
    let d = '', prev = null;
    pts.forEach(p => { d += (prev && p.ts - prev.ts < 12 * TL.HOUR ? 'L' : 'M') + X(p.ts).toFixed(1) + ' ' + Y(p[kind]).toFixed(1) + ' '; prev = p; });
    if (d) s += '<path d="' + d + '" fill="none" stroke="var(--sp)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(p => {
      const a = TL.assess(p[kind], TL.rangesAt(t, p.ts)[key], key, t.tol);
      if (urgent(a.level)) s += '<circle class="' + lvl(a.level) + '" cx="' + X(p.ts).toFixed(1) + '" cy="' + Y(p[kind]).toFixed(1) + '" r="3.2" fill="var(--lc)"/>';
    });
    s += '<line id="cx-line" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--fg)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
    s += '<circle id="cx-dot" cx="0" cy="0" r="5" fill="var(--surface)" stroke="var(--sp)" stroke-width="3" opacity="0"/></svg>';
    chartState = { pts, X, Y, kind, unit, W, t, key };
    return s;
  }
  function bindChart() {
    const svg = document.querySelector('svg.chart');
    if (!svg || !chartState || !chartState.pts.length) return;
    const pick = ev => {
      const rect = svg.getBoundingClientRect();
      const x = (ev.clientX - rect.left) / rect.width * chartState.W;
      let best = null, bd = Infinity;
      for (const p of chartState.pts) { const dd = Math.abs(chartState.X(p.ts) - x); if (dd < bd) { bd = dd; best = p; } }
      if (!best) return;
      const px = chartState.X(best.ts), py = chartState.Y(best[chartState.kind]);
      const ln = svg.querySelector('#cx-line'), dt = svg.querySelector('#cx-dot');
      ln.setAttribute('x1', px); ln.setAttribute('x2', px); ln.setAttribute('opacity', '0.5');
