      ((l.fixture || l.pos || l.night) ? '<span class="uvi">' + (l.fixture ? '<span class="tag">' + esc(l.fixture) + '</span>' : '') + (l.pos === 'inside' ? '<span class="tag">im Terrarium' + (l.guard === true ? ', mit Schutzkorb' : l.guard === false ? ', ohne Schutzkorb' : '') + '</span>' : l.pos === 'above' ? '<span class="tag">über dem Gitter</span>' : '') + (l.night ? '<span class="tag">auch nachts an</span>' : '') + '</span>' : '');
    const own = adviceOf(terrs().find(x => x.id === l.tid) || terrs()[0]).filter(a => a.lid === l.id && a.level !== 'none');
    if (own.length) s += own.map(a => '<span class="xs ' + lvl(a.level) + '" style="color:var(--lt);background:var(--ls);border-radius:8px;padding:6px 9px">' + esc(a.text) + '</span>').join('');
    if (i.pct !== null) s += '<div class="bar" role="img" aria-label="' + i.pct + ' Prozent der Lebensdauer verbraucht"><i style="width:' + i.pct + '%"></i></div><span class="xs">Eingesetzt ' + esc(dayTxt(l.installed)) + ' · tauschen am <b class="num">' + esc(dateLong(i.dueAt)) + '</b></span>';
    s += '</div><div class="actions">' + (l.installed ? '<button class="btn sm" data-a="lnew" data-v="' + l.id + '">' + icon('swap', 16) + 'Neue Lampe eingesetzt</button>' : '') +
      '<button class="btn sm ghost" data-a="ledit" data-v="' + l.id + '" aria-label="Bearbeiten">' + icon('edit', 16) + '</button></div>';
    if (l.type === 'led') { /* LED: kein Alter, keine Lebensdauer */ } else if (!l.installed) s += '<div class="quick"><span>Wie alt ist die Lampe?</span><input class="num-in" inputmode="decimal" id="qa-' + l.id + '" placeholder="Monate" aria-label="Alter in Monaten"><button class="btn sm" data-a="lage" data-v="' + l.id + '">Speichern</button><button class="btn sm" data-a="lnew" data-v="' + l.id + '">Heute neu eingesetzt</button></div>';
    else if (i.daysLeft === null) s += '<div class="quick"><span>Lebensdauer fehlt. Trag sie von der Verpackung ein.</span><button class="btn sm" data-a="ledit" data-v="' + l.id + '">Eintragen</button></div>';
    return s + '</div>';
  }

  /* ================= Ansichten ================= */
  function viewDash() {
    const c = counts(), list = terrs();
    const inTarget = list.filter(t => assessOf(t).level === 'green').length;
    const latest = allReadings().length ? allReadings()[allReadings().length - 1].ts : null;
    const climLv = c.climate ? 'red' : climateIssues().length ? 'yellow' : inTarget ? 'green' : 'none';
    const hr = new Date(now()).getHours(), greet = hr < 11 ? 'Guten Morgen' : hr < 18 ? 'Guten Tag' : 'Guten Abend';
    const openImp = list.reduce((n, t) => n + (t.improve || []).filter(x => !x.done && (x.level === 'orange' || x.level === 'red')).length, 0);
    const todo = [];
    if (c.climate) todo.push(['warn', c.climate + (c.climate === 1 ? ' Terrarium' : ' Terrarien') + ' mit Klima außerhalb', 'r']);
    if (c.tasksDue) todo.push(['tasks', c.tasksDue + (c.tasksDue === 1 ? ' Aufgabe fällig' : ' Aufgaben fällig'), 'o']);
    if (c.lampsDue) todo.push(['lamps', c.lampsDue + (c.lampsDue === 1 ? ' Lampe tauschen' : ' Lampen tauschen'), 'o']);
    if (c.lampWarn) todo.push(['lamps', c.lampWarn + (c.lampWarn === 1 ? ' Lampen-Hinweis' : ' Lampen-Hinweise'), 'y']);
    if (openImp) todo.push(['warn', openImp + ' wichtige Verbesserung' + (openImp === 1 ? '' : 'en'), 'y']);
    let h = '<section class="hero"><div class="grow"><h2>' + greet + '</h2><p>' + (todo.length ? 'Das braucht heute deine Aufmerksamkeit:' : latest ? 'Alles ruhig, kein Terrarium braucht dich gerade.' : 'Noch keine Messwerte. Trag den ersten ein oder verbinde die Sensoren.') + '</p></div>' +
      (todo.length ? '<div class="chips">' + todo.map(x => '<button class="hchip ' + x[2] + '" data-a="go" data-v="' + x[0] + '">' + esc(x[1]) + '</button>').join('') + '</div>' : '') + '</section>' +
      '<div class="quick-row"><button class="qbtn" data-a="entry"><span class="ic">' + icon('temp', 18) + '</span><span class="sm"><b>Messwert</b></span></button><button class="qbtn" data-a="go" data-v="animals"><span class="ic">' + icon('paw', 18) + '</span><span class="sm"><b>Tier-Eintrag</b></span></button><button class="qbtn" data-a="go" data-v="check"><span class="ic">' + icon('lamp', 18) + '</span><span class="sm"><b>Lampen-Check</b></span></button><button class="qbtn" data-a="go" data-v="wissen"><span class="ic">' + icon('other', 18) + '</span><span class="sm"><b>Wissen</b></span></button></div>' +
      (animals().length ? '<section class="card"><div class="card-h"><h3>Meine Tiere</h3></div><div class="pets">' + animals().map(a => '<button class="pet ' + sp(terrs().find(x => x.id === a.tid) || { species: 'other' }) + '" data-a="gotier" data-v="' + a.id + '"><span class="sb-av">' + (a.photo ? '<img src="' + esc(a.photo) + '" alt="">' : esc((a.name || '?').slice(0, 1).toUpperCase())) + '</span><span class="col" style="gap:0;text-align:left"><b class="sm">' + esc(a.name) + '</b><span class="xs">' + esc(terrName(a.tid)) + '</span></span></button>').join('') + '</div></section>' : '') +
      '<div class="grid g-kpi">' +
      '<button class="card kpi ' + lvl(climLv) + '" data-a="go" data-v="warn"><span class="lab">Klima im Zielbereich</span><span class="val">' + inTarget + '<small> / ' + list.length + '</small></span><span class="sub">' + (c.climate ? c.climate + ' Terrarium braucht dich' : climateIssues().length ? 'Beobachten' : latest ? 'Alles ruhig' : 'Noch keine Messwerte') + '</span></button>' +
      '<button class="card kpi ' + lvl(c.tasksDue ? 'orange' : c.tasksSoon ? 'yellow' : 'green') + '" data-a="go" data-v="tasks"><span class="lab">Aufgaben fällig</span><span class="val">' + c.tasksDue + '</span><span class="sub">' + (c.tasksSoon ? c.tasksSoon + ' bald' : 'keine bald fällig') + (c.tasksNoDate ? ' · ' + c.tasksNoDate + ' ohne Datum' : '') + '</span></button>' +
      '<button class="card kpi ' + lvl(c.lampsDue || c.lampWarn ? 'orange' : c.lampsSoon ? 'yellow' : c.lampsNoDate ? 'none' : 'green') + '" data-a="go" data-v="lamps"><span class="lab">Lampen tauschen / prüfen</span><span class="val">' + c.lampsDue + '</span><span class="sub">' + (c.lampWarn ? c.lampWarn + ' Hinweise · ' : '') + (c.lampsSoon ? c.lampsSoon + ' bald' : 'keine bald') + (c.lampsNoDate ? ' · ' + c.lampsNoDate + ' ohne Alter' : '') + '</span></button>' +
      '<div class="card kpi ' + lvl(latest ? ((now() - latest) / TL.HOUR > 24 ? 'yellow' : 'green') : 'none') + '"><span class="lab">Letzte Messung</span><span class="val" style="font-size:20px;padding:5px 0">' + (latest ? esc(ageText(latest)) : '–') + '</span><span class="sub">' + (latest ? esc(dateTime(latest)) : 'Trag den ersten Wert ein') + '</span></div></div>';
    h += '<div class="grid g-3">' + list.map(t => {
      const r = lastReading(t.id), a = assessOf(t), rows = readingsOf(t.id).filter(x => x.ts >= now() - 2 * TL.DAY);
      const sm = TL.SPECIES[t.species] || TL.SPECIES.other;
      return '<section class="card tpanel ' + sp(t) + '"><div class="hd"><div class="grow col" style="gap:2px"><h2>' + esc(t.name) + '</h2><span class="sptag">' + esc(sm.name) + ' · ' + (a.phase === 'night' ? 'Nacht' : 'Tag') + '</span></div>' + pill(a.level, a.reason === 'nodata' ? 'Kein Messwert' : a.stale ? 'Messwert alt' : null) + '</div>' +
        ringsFor(t, a, r) + targetsHtml(t) +
        '<div class="sparks"><div><div class="spark-l"><span>Temperatur 48 Std.</span></div>' + spark(rows, 't') + '</div><div><div class="spark-l"><span>Luftfeuchte 48 Std.</span></div>' + spark(rows, 'h') + '</div></div>' +
        '<div class="row between"><span class="xs">' + (r ? 'Gemessen ' + esc(ageText(r.ts)) : 'Noch nicht gemessen') + '</span><div class="row" style="gap:6px"><button class="btn sm" data-a="open" data-v="' + t.id + '">Details</button><button class="btn sm pri" data-a="entry" data-v="' + t.id + '">' + icon('plus', 16) + 'Messwert</button></div></div></section>';
    }).join('') + '</div>';
    const tl = taskList().filter(x => x.d.daysLeft !== null).slice(0, 6);
    const noDate = taskList().filter(x => x.d.daysLeft === null).length;
    const ll = lampList();
    const iss = climateIssues();
    const impr = list.map(t => ({ t, n: (t.improve || []).filter(x => !x.done).length })).filter(x => x.n);
    const pats = [];
    list.forEach(t => TL.patterns(t, readingsOf(t.id), now(), 7).list.slice(0, 2).forEach(p => pats.push({ t, p })));
    h += '<div class="grid g-3">' +
      '<section class="card"><div class="card-h"><h3>Als Nächstes zu tun</h3><button class="btn sm ghost" data-a="go" data-v="tasks">Alle</button></div>' +
      (tl.length ? '<div class="list">' + tl.map(x => taskRow(x, true)).join('') + '</div>' : '') +
      (noDate ? '<div class="banner lv-yellow" style="margin-top:10px"><span class="grow">' + noDate + ' Aufgaben ohne Datum. Trag ein, wann du sie zuletzt gemacht hast, dann rechnet die App mit.</span><button class="btn sm" data-a="go" data-v="tasks">Eintragen</button></div>' : '') + '</section>' +
      '<section class="card"><div class="card-h"><h3>Lampen</h3><button class="btn sm ghost" data-a="go" data-v="lamps">Alle</button></div><div class="list">' +
      (ll.length ? ll.slice().sort((a, b) => (a.i.level === 'green') - (b.i.level === 'green')).slice(0, 4).map(x => lampMini(x)).join('') + (ll.length > 4 ? '<p class="xs">und ' + (ll.length - 4) + ' weitere Lampen</p>' : '') : '<p class="xs">Keine Lampen eingetragen.</p>') + '</div></section>' +
      '<section class="card"><div class="card-h"><h3>Auffällig</h3><button class="btn sm ghost" data-a="go" data-v="warn">Warnungen</button></div>' +
      (iss.length || pats.length || impr.length ? '<div class="list">' + impr.map(x => '<div class="li lv-yellow"><div class="ic">' + icon('care', 18) + '</div><div class="grow col" style="gap:2px"><span class="main-t">' + esc(x.t.name) + '</span><span class="xs">' + x.n + ' Verbesserungen offen</span></div><button class="btn sm" data-a="open" data-v="' + x.t.id + '">Ansehen</button></div>').join('') + iss.map(x => '<div class="li ' + lvl(x.a.level) + '"><div class="ic">' + icon('bell', 18) + '</div><div class="grow col" style="gap:2px"><span class="main-t">' + esc(x.t.name) + '</span><span class="xs">' + esc(describe(x.a)) + '</span></div></div>').join('') +
        pats.map(x => '<div class="li ' + lvl(x.p.level) + '"><div class="ic">' + icon(x.p.kind === 'temp' ? 'temp' : 'drop', 18) + '</div><div class="grow col" style="gap:2px"><span class="main-t">' + esc(x.t.name) + '</span><span class="xs">' + esc(x.p.text) + '</span></div></div>').join('') + '</div>'
        : '<p class="xs">Keine Auffälligkeiten in den letzten 7 Tagen.' + (allReadings().length ? '' : ' Dafür braucht die App Messwerte.') + '</p>') + '</section></div>';
    return h;
  }
  function lampMini(x) {
    const l = x.l, i = x.i;
    return '<div class="li ' + lvl(i.level) + '"><div class="ic">' + icon(lampIcon(l), 18) + '</div><div class="grow col" style="gap:4px"><div class="row between" style="gap:6px"><span class="main-t sm">' + esc(l.name) + '</span><span class="xs">' + esc(terrName(l.tid)) + '</span></div>' +
      (i.pct !== null ? '<div class="bar"><i style="width:' + i.pct + '%"></i></div><span class="xs">' + esc(i.label) + '</span>' : '<span class="xs" style="color:var(--yt)">' + esc(i.label) + '</span>') + '</div></div>';
  }
  function describe(a) {
    if (a.reason === 'nodata') return 'Noch kein Messwert.';
    if (a.reason === 'noprofile') return 'Keine Zielwerte festgelegt.';
    const parts = [];
    if (a.temp.level !== 'green' && a.temp.level !== 'none') parts.push(a.temp.edge ? 'Temperatur knapp am Rand' : 'Temperatur ' + fmt(a.temp.dev) + ' °C ' + (a.temp.dir > 0 ? 'zu hoch' : 'zu niedrig'));
    if (a.hum.level !== 'green' && a.hum.level !== 'none') parts.push(a.hum.edge ? 'Luftfeuchte knapp am Rand' : 'Luftfeuchte ' + fmt(a.hum.dev, 0) + ' % ' + (a.hum.dir > 0 ? 'zu hoch' : 'zu niedrig'));
    if (a.stale) parts.push('letzter Wert ' + Math.round(a.ageH) + ' Std. alt');
    return parts.length ? parts.join(', ') + '.' : 'Im Zielbereich.';
  }

  function targetsHtml(t) {
    const ph = TL.phaseAt(t, now());
    const n = v => fmt(v, Number.isInteger(v) ? 0 : 1);
    const rt = (r, u) => TL.rangeSet(r) ? n(r.min) + '–' + n(r.max) + ' ' + u : 'offen';
    const row = (k, l, ic) => '<span class="ph' + (ph === k ? ' on' : '') + '">' + icon(ic, 15) + l + '</span><span class="num">' + esc(rt(t[k].temp, '°C')) + '</span><span class="num">' + esc(rt(t[k].hum, '%')) + '</span>';
    return '<div class="targets" aria-label="Zielwerte">' + row('day', 'Tag', 'sun') + row('night', 'Nacht', 'moon') + '<span class="xs" style="grid-column:1/-1">Tag ' + esc(t.dayStart) + '–' + esc(t.dayEnd) + ' Uhr, sonst Nacht</span></div>';
  }
  function adviceOf(t, list) { return TL.lampAdvice(t, list || lamps()); }
  function adviceLine(x, withSrc) {
    return '<div class="li ' + lvl(x.level) + '"><div class="ic">' + icon(x.level === 'none' ? 'other' : 'bell', 17) + '</div><div class="grow col" style="gap:3px"><span class="sm">' + esc(x.text) + '</span>' + (withSrc && x.sources.length ? '<span class="src">' + srcLinks(x.sources) + '</span>' : '') + '</div>' + (x.level !== 'none' ? pill(x.level, x.level === 'yellow' ? 'Nicht optimal' : x.level === 'orange' ? 'Achtung' : 'Dringend') : '') + '</div>';
  }
  function adviceCard(t) {
    const adv = adviceOf(t), bad = adv.filter(x => x.level !== 'none'), info = adv.filter(x => x.level === 'none');
    return '<section class="card"><div class="card-h"><h3>Prüfung deiner Lampen</h3>' + (bad.length ? pill(bad[0].level, bad.length + (bad.length === 1 ? ' Hinweis' : ' Hinweise')) : pill('green', 'Passt soweit')) + '</div>' +
      (bad.length ? '<div class="list">' + bad.map(x => adviceLine(x, true)).join('') + '</div>' : '<p class="sm">Nach dem, was eingetragen ist, passt die Beleuchtung zum Bedarf der Art.</p>') +
      (info.length ? '<h4 style="margin:14px 0 6px">Noch offen</h4><div class="list">' + info.map(x => adviceLine(x, false)).join('') + '</div>' : '') + '</section>';
  }
  function improveCard(t) {
    const list = t.improve || [];
    if (!list.length) return '';
    const open = list.filter(x => !x.done);
    return '<section class="card"><div class="card-h"><h3>Verbesserungen</h3>' + (open.length ? pill(open.some(x => x.level === 'orange' || x.level === 'red') ? 'orange' : 'yellow', open.length + ' offen') : pill('green', 'Alles erledigt')) + '</div><div class="list">' +
      list.map(x => '<div class="li ' + lvl(x.done ? 'green' : x.level) + '"><button class="ic" style="border:0;cursor:pointer" data-a="imptog" data-v="' + esc(x.id) + '" aria-label="' + (x.done ? 'Als offen markieren' : 'Als erledigt markieren') + '">' + icon(x.done ? 'check' : 'other', 17) + '</button><div class="grow col" style="gap:3px"><span class="main-t sm"' + (x.done ? ' style="text-decoration:line-through;opacity:.6"' : '') + '>' + esc(x.title) + '</span><span class="sm">' + esc(x.text) + '</span>' + (x.sources && x.sources.length ? '<span class="src">' + srcLinks(x.sources) + '</span>' : '') + '</div>' + (x.done ? pill('green', 'Erledigt') : x.level !== 'none' ? pill(x.level, x.level === 'yellow' ? 'Verbessern' : x.level === 'orange' ? 'Wichtig' : 'Dringend') : '') + '</div>').join('') +
      '</div><p class="xs" style="margin-top:10px">Tippe auf das Symbol links, um einen Punkt abzuhaken.</p></section>';
  }
  function shopCard(t) {
    const list = TL.SHOP[t.species];
    if (!list) return '';
    const exo = TL.hasExoCover(t), su = TL.slotUse(t, lamps());
    const slotTxt = (n, k) => su[k].total === null ? '' : n + ': ' + su[k].used + ' von ' + su[k].total + ' belegt, ' + su[k].free + ' frei';
    const slotLine = [slotTxt('Exo-Terra-Abdeckung', 'exo'), slotTxt('Fassung mit Schirm', 'shade')].filter(Boolean).join(' · ');
    const exoOk = exo && su.exo.free !== 0, shadeOk = su.shade.free !== 0;
    const btn = (q, label) => '<a class="btn sm" href="' + esc(TL.shopLink(q)) + '" target="_blank" rel="noopener">' + label + '</a>';
    return '<section class="card"><div class="card-h"><h3>Passende Leuchtmittel suchen</h3><button class="btn sm pri" data-a="gempf" data-v="' + t.id + '">Genaue Empfehlungen je Fassung</button></div>' +
      (exo ? '<div class="banner lv-yellow" style="margin-bottom:10px"><span class="grow">Deine Abdeckungen sind von Exo Terra. Dort passen nur Exo-Terra-Leuchtmittel. In Fassungen mit Lampenschirm geht jede Marke, wenn Fassung und Leistung passen.</span></div>' : '') +
      '<div class="list">' +
      list.map(x => '<div class="li"><div class="ic">' + icon('lamp', 17) + '</div><div class="grow col" style="gap:3px"><span class="main-t sm">' + esc(x.title) + '</span><span class="sm">' + esc(x.why) + '</span>' + (x.brand && exo ? '<span class="sm">Diese Marke passt nicht in die Exo-Terra-Abdeckung, nur in einen Lampenschirm oder eine andere Armatur.</span>' : '') + '<span class="src">' + srcLinks(x.sources) + '</span></div><div class="col" style="gap:6px">' +
        (x.brand ? btn(x.q, 'Für Lampenschirm suchen') : (exo ? (exoOk ? btn('Exo Terra ' + x.q, 'Für Exo-Terra-Abdeckung') : '') + (shadeOk ? btn(x.q, 'Für Lampenschirm') : '') + (!exoOk && !shadeOk ? btn('Exo Terra ' + x.q, 'Zum Ersetzen suchen') : '') : btn(x.q, 'Bei Amazon suchen'))) + '</div></div>').join('') +
      '</div><p class="xs" style="margin-top:10px">Die Links öffnen eine Amazon-Suche, sortiert nach Kundenbewertung. Welche Marke gerade beliebt ist, wie teuer sie ist und ob sie lieferbar ist, siehst du dort. Das kann die App nicht abrufen. Prüfe vor dem Kauf, ob Fassung, Länge und Leistung zu deiner Abdeckung passen. Ein Metalldampfstrahler braucht ein eigenes Vorschaltgerät.</p></section>';
  }

  function hoursCard(t) {
    const hc = TL.hoursCheck(t, lamps());
    if (!hc) return '';
    const rows = hc.rows.filter(x => x.h !== null || x.level !== 'none');
    return '<section class="card"><div class="card-h"><h3>Brenndauer und Bewertung</h3>' + (hc.day ? pill(hc.dayLevel === 'green' ? 'green' : 'yellow', 'Licht ' + fmt(hc.day, 0) + ' Std. am Tag') : pill('none', 'Noch keine Brenndauer')) + '</div>' +
      '<p class="sm">Empfohlen: <b>' + esc(hc.range.text) + '</b> Licht am Tag. Trag bei jeder Lampe ein, wie lange sie brennt (Stift an der Lampe).<span class="src">' + srcLinks(hc.range.src) + '</span></p>' +
      (rows.length ? '<div class="list">' + rows.map(x => '<div class="li ' + lvl(x.level) + '"><div class="ic">' + icon(lampIcon(x.l), 17) + '</div><div class="grow col" style="gap:2px"><span class="main-t sm">' + esc(x.l.name) + '</span><span class="xs">' + (x.h !== null ? fmt(x.h, 0) + ' Std. pro Tag. ' : '') + esc(x.text) + '</span></div>' + (x.level === 'green' ? pill('green', 'Passt') : x.level === 'yellow' ? pill('yellow', 'Nicht optimal') : '') + '<button class="btn sm ghost" data-a="ledit" data-v="' + x.l.id + '" aria-label="Bearbeiten">' + icon('edit', 16) + '</button></div>').join('') + '</div>' : '<div class="empty">Noch keine Lampen eingetragen.</div>') + '</section>';
  }
  function subLogCard(t) {
    const st = TL.substrateStatus(t, now()), log = (t.subLog || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
    return '<form id="sublog-form" class="card" novalidate><div class="card-h"><h3>Substrat eintragen</h3>' + (st ? pill(st.level === 'green' ? 'green' : st.level, st.level === 'green' ? 'Frisch' : st.level === 'yellow' ? 'Bald wechseln' : st.level === 'orange' ? 'Überfällig' : 'Eingetragen') : pill('none', 'Noch nichts eingetragen')) + '</div>' +
      (st ? '<p class="sm">Letzter Wechsel am ' + esc(dayTxt(st.last.date)) + '. ' + esc(st.text) + (st.depthNote ? ' ' + esc(st.depthNote) : '') + '<span class="src">' + srcLinks(st.src) + '</span></p>' : '<p class="sm">Trag ein, was du einfüllst und wann. Die App rechnet dann, wann der nächste Wechsel dran ist.</p>') +
      '<div class="f-grid"><label class="f">Datum<input type="date" id="sl-date" value="' + TL.isoDay(now()) + '" max="' + TL.isoDay(now()) + '"></label><label class="f">Substrat und Firma<input id="sl-prod" placeholder="z. B. Selbst gemischt oder The Bio Dude Terra Fauna"></label><label class="f">Höhe in cm<input class="num-in" inputmode="decimal" id="sl-depth" placeholder="z. B. 8"></label></div>' +
      '<label class="f">Notiz<input id="sl-note" placeholder="optional"></label><div class="row" style="margin-top:12px"><button type="submit" class="btn pri">Eintragen</button></div>' +
      (log.length ? '<h4 style="margin:14px 0 6px">Bisher</h4><div class="list">' + log.map((x, i) => '<div class="li"><div class="ic">' + icon('soil', 17) + '</div><div class="grow col" style="gap:2px"><span class="main-t sm">' + esc(dayTxt(x.date)) + ' · ' + esc(x.product || 'Substrat') + '</span><span class="xs">' + (x.depth ? esc(x.depth) + ' cm' : 'Höhe offen') + (x.note ? ' · ' + esc(x.note) : '') + '</span></div><button type="button" class="btn sm danger ghost" data-a="sldel" data-v="' + esc(x.date + '|' + (x.product || '')) + '" aria-label="Eintrag löschen">' + icon('trash', 16) + '</button></div>').join('') + '</div>' : '') + '</form>';
  }
  function quickTasks(t) {
    const list = taskList(t.id); if (!list.length) return '';
    return '<section class="card"><div class="card-h"><h3>Schnell abhaken</h3></div><p class="sm">Tippe auf eine Pflege, die du heute gemacht hast.</p><div class="row wrap" style="gap:8px">' + list.map(x => '<button class="btn sm' + (x.k.last === TL.isoDay(now()) ? '' : ' pri') + '" data-a="tdone" data-v="' + x.k.id + '">' + icon(x.k.last === TL.isoDay(now()) ? 'check' : 'plus', 16) + esc(x.k.title) + (x.k.last === TL.isoDay(now()) ? ' (heute erledigt)' : '') + '</button>').join('') + '</div></section>';
  }
  function equipCard(t) {
    const e = t.equip || { covers: '', ballast: null, notes: '' };
    return '<form id="equip-form" class="card" novalidate><div class="card-h"><h3>Abdeckung und Technik</h3></div><div class="grid g-2">' +
      '<label class="f">Abdeckungen und Fassungen<textarea id="q-covers" placeholder="z. B. Exo Terra Abdeckung groß mit LED und einer Fassung">' + esc(e.covers) + '</textarea></label>' +
      '<div class="col" style="gap:12px"><label class="f">Vorschaltgerät für Röhren<select id="q-ballast"><option value=""' + (e.ballast === null ? ' selected' : '') + '>weiß nicht</option><option value="1"' + (e.ballast === true ? ' selected' : '') + '>vorhanden</option><option value="0"' + (e.ballast === false ? ' selected' : '') + '>keins</option></select></label>' +
      '<label class="f">Notiz<input id="q-notes" value="' + esc(e.notes) + '"></label></div></div><div class="grid g-2" style="margin-top:12px"><label class="f">Plätze in Exo-Terra-Abdeckungen (ohne fest eingebaute LED)<input id="q-slexo" inputmode="numeric" value="' + (e.slots && e.slots.exo != null ? esc(e.slots.exo) : '') + '"></label><label class="f">Plätze in Fassungen mit Schirm<input id="q-slshade" inputmode="numeric" value="' + (e.slots && e.slots.shade != null ? esc(e.slots.shade) : '') + '"></label></div><div class="row" style="margin-top:12px"><button type="submit" class="btn">Technik speichern</button></div></form>';
  }
  function lightingCard(t, compact) {
    const li = TL.LIGHTING[t.species];
    if (!li) return '<section class="card ' + sp(t) + '"><div class="card-h"><h3>Licht für ' + esc(t.name) + '</h3></div><p class="xs">Für diese Art hat die App keine Lichtempfehlung.</p></section>';
    const ck = TL.lightCheck(t, lamps());
    const item = (ic, title, body) => '<div class="lrow"><div class="ic">' + icon(ic, 17) + '</div><div><b>' + title + '</b><p>' + body + '</p></div></div>';
    return '<section class="card ' + sp(t) + '" style="border-top:4px solid var(--sp)"><div class="card-h"><div class="grow col" style="gap:2px"><h3>' + (compact ? 'Licht: ' + esc(t.name) : 'Welches Licht braucht dieses Tier?') + '</h3><span class="sptag">' + esc(TL.SPECIES[t.species].name) + '</span></div>' +
      (ck.issues.length ? pill('orange', 'Lampe fehlt') : pill('green', 'UV-B und Wärme eingetragen')) + '</div><div class="lgrid">' +
      item('uvb', 'UV-B', esc(li.uvb) + '<span class="uvi"><span class="tag">Ferguson-Zone ' + esc(li.zone) + '</span>' + (li.uviMax ? '<span class="tag">UV-Index am Sonnenplatz höchstens ' + esc(li.uviMax) + '</span>' : '') + (li.uviRange ? '<span class="tag">übriges Terrarium ' + esc(li.uviRange) + '</span>' : '') + '</span>') +
      (compact ? '' : item('other', 'Wie wichtig ist UV-B?', esc(li.uvbNeed))) +
      item('lamp', 'Wärme', esc(li.heat)) + item('sun', 'Lichtdauer', esc(li.hours)) + item('moon', 'Nacht', esc(li.night)) + '</div>' +
      (ck.issues.length ? '<div class="banner lv-orange" style="margin-top:12px"><span class="grow">' + esc(ck.issues.join(' ')) + '</span><button class="btn sm" data-a="lnewform" data-v="' + t.id + '">Lampe eintragen</button></div>' : '') +
      (compact ? '' : '<p class="xs" style="margin-top:12px">Ob die Stärke passt, hängt vom Abstand und von Gitter oder Glas zwischen Lampe und Tier ab. Sicher weißt du es nur mit einem UV-Index-Messgerät am Sonnenplatz.</p><div class="src" style="margin-top:8px"><b>Quellen</b>' + srcLinks(li.sources) + '</div>') + '</section>';
  }

  function viewTerrs() {
    return '<div class="grid g-3">' + terrs().map(t => {
      const a = assessOf(t), r = lastReading(t.id), sz = t.size || {};
      return '<button class="card tpanel ' + sp(t) + '" data-a="open" data-v="' + t.id + '" style="text-align:left;cursor:pointer;font:inherit;color:inherit"><div class="hd"><div class="grow col" style="gap:2px"><h2>' + esc(t.name) + '</h2><span class="sptag">' + esc((TL.SPECIES[t.species] || TL.SPECIES.other).name) + '</span></div>' + pill(a.level, a.reason === 'nodata' ? 'Kein Messwert' : null) + '</div>' +
        '<div class="meta"><span class="tag">' + (sz.l && sz.b && sz.h ? esc(sz.l + ' × ' + sz.b + ' × ' + sz.h + ' cm') : 'Maße fehlen') + '</span><span class="tag">' + (r ? esc(fmt(r.t)) + ' °C · ' + esc(fmt(r.h, 0)) + ' %' : 'kein Wert') + '</span><span class="tag">' + lamps().filter(l => l.tid === t.id).length + ' Lampen</span><span class="tag">' + tasks().filter(k => k.tid === t.id).length + ' Aufgaben</span></div></button>';
    }).join('') + '</div><div><button class="btn" data-a="tnew">' + icon('plus', 16) + 'Terrarium hinzufügen</button></div>';
  }

  const TABS = [['klima', 'Klima'], ['verlauf', 'Verlauf'], ['lampen', 'Lampen'], ['empf', 'Empfehlungen'], ['subs', 'Substrat'], ['wissen', 'Wissen'], ['aufgaben', 'Aufgaben'], ['tiere', 'Tiere'], ['setup', 'Einrichtung']];
  function viewTerr() {
    const t = terr(S.tid);
    const tl = taskList(t.id), ll = lampList(t.id);
    const cnt = { lampen: ll.filter(x => urgent(x.i.level)).length, aufgaben: tl.filter(x => urgent(x.d.level)).length };
    let h = '<div class="tabs" role="tablist">' + TABS.map(([k, l]) => '<button role="tab" class="' + (S.tab === k ? 'on' : '') + '" aria-selected="' + (S.tab === k) + '" data-a="tab" data-v="' + k + '">' + l + (cnt[k] ? '<span class="cnt2">' + cnt[k] + '</span>' : '') + '</button>').join('') + '</div>';
    if (S.tab === 'klima') h += tabKlima(t) + improveCard(t);
    else if (S.tab === 'verlauf') h += tabVerlauf(t);
    else if (S.tab === 'setup') h += tabSetup(t);
    else if (S.tab === 'empf') h += viewEmpf();
    else if (S.tab === 'subs') h += viewSubs();
    else if (S.tab === 'wissen') h += viewWissen();
    else if (S.tab === 'lampen') h += improveCard(t) + adviceCard(t) + hoursCard(t) + '<div class="banner lv-yellow"><span class="grow">Welche Lampe in welche Fassung passt, steht im Reiter Empfehlungen.</span><button class="btn sm pri" data-a="tab" data-v="empf">Empfehlungen öffnen</button></div>' + '<section class="card"><div class="card-h"><h3>Deine Lampen in diesem Terrarium</h3><button class="btn sm" data-a="lnewform" data-v="' + t.id + '">' + icon('plus', 16) + 'Lampe</button></div>' + (ll.length ? '<div class="list">' + ll.map(x => lampRow(x, false)).join('') + '</div>' : '<div class="empty">Noch keine Lampen.</div>') + '</section>' + socketForm(t, false) + lightingCard(t, false) + lampSourceNote();
    else if (S.tab === 'aufgaben') h += quickTasks(t) + '<section class="card"><div class="card-h"><h3>Aufgaben für dieses Terrarium</h3><button class="btn sm" data-a="knew" data-v="' + t.id + '">' + icon('plus', 16) + 'Aufgabe</button></div>' + (tl.length ? '<div class="list">' + tl.map(x => taskRow(x, false)).join('') + '</div>' : '<div class="empty">Noch keine Aufgaben.</div>') + '</section><p class="xs">Die Intervalle sind Startwerte der App, keine Haltungsvorschrift. Pass sie über den Stift an deinen Rhythmus an.</p>';
    else h += tabAnimals(t);
    return h;
  }
  function tabKlima(t) {
    const r = lastReading(t.id), a = assessOf(t), rows = readingsOf(t.id);
    const adv = TL.adviceFor(a), pats = TL.patterns(t, rows, now(), 7);
    let h = '<div class="grid g-2 g-2w"><section class="card big-rings"><div class="card-h"><h3>Aktuell</h3>' + pill(a.level, a.reason === 'nodata' ? 'Kein Messwert' : a.stale ? 'Messwert alt' : null) + '</div>' + ringsFor(t, a, r) +
      targetsHtml(t) + '<div class="row between" style="margin-top:12px"><span class="xs">' + (r ? esc(dateTime(r.ts)) + ' · ' + (a.phase === 'night' ? 'Nachtwerte' : 'Tagwerte') + ' · ' + (r.src === 'sensor' ? 'Sensor' : 'manuell') : 'Noch kein Messwert') + '</span><button class="btn sm pri" data-a="entry" data-v="' + t.id + '">' + icon('plus', 16) + 'Messwert</button></div></section>' +
      '<section class="card"><div class="card-h"><h3>Was prüfen?</h3></div>' + (a.level === 'green' ? '<p class="sm">Alles im Zielbereich. Nichts zu tun.</p>' : '<ul class="adv">' + adv.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>') +
      '<h4 style="margin:16px 0 8px">Letzte 7 Tage</h4>' + (pats.list.length ? '<div class="list">' + pats.list.map(p => '<div class="li ' + lvl(p.level) + '"><div class="ic">' + icon(p.kind === 'temp' ? 'temp' : 'drop', 18) + '</div><div class="grow col" style="gap:2px"><span class="sm">' + esc(p.text) + '</span><span class="xs">' + esc(p.tip) + '</span></div></div>').join('') + '</div>' : '<p class="xs">' + (pats.considered ? 'Keine wiederkehrenden Abweichungen.' : 'Noch zu wenige Messwerte.') + '</p>') + '</section></div>';
    const last = rows.slice(-12).reverse();
    h += '<section class="card"><div class="card-h"><h3>Letzte Messwerte</h3><span class="xs">' + rows.length + ' insgesamt</span></div>' +
      (last.length ? '<div class="tbl-wrap"><table><thead><tr><th>Zeit</th><th>Phase</th><th>Temperatur</th><th>Luftfeuchte</th><th class="hide-s">Notiz</th><th></th></tr></thead><tbody>' + last.map(x => {
        const rg = TL.rangesAt(t, x.ts), at = TL.assess(x.t, rg.temp, 'temp', t.tol), ah = TL.assess(x.h, rg.hum, 'hum', t.tol);
        return '<tr><td class="num">' + esc(dateTime(x.ts)) + '</td><td>' + (rg.phase === 'night' ? 'Nacht' : 'Tag') + '</td><td class="' + lvl(at.level) + '"><span class="pill">' + (x.t === null ? '–' : fmt(x.t) + ' °C') + '</span></td><td class="' + lvl(ah.level) + '"><span class="pill">' + (x.h === null ? '–' : fmt(x.h, 0) + ' %') + '</span></td><td class="hide-s xs">' + esc(x.n) + '</td><td style="text-align:right">' +
          (S.confirm === 'r:' + x.id ? '<button class="btn sm dangerfill" data-a="rdel" data-v="' + x.id + '">Löschen</button> <button class="btn sm" data-a="cancel">Nein</button>' : '<button class="btn sm ghost" data-a="ask" data-v="r:' + x.id + '" aria-label="Messwert löschen">' + icon('trash', 16) + '</button>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty">Noch keine Messwerte. Sobald die SwitchBot-Sensoren verbunden sind, kommen sie automatisch.<button class="btn pri" data-a="entry" data-v="' + t.id + '">Ersten Messwert eintragen</button></div>') + '</section>';
    return h;
  }
  function tabVerlauf(t) {
    const rows = readingsOf(t.id);
    const days = +S.chartRange, to = now(), from = to - days * TL.DAY;
    const inR = rows.filter(r => r.ts >= from);
    const st = TL.stats(t, inR);
    const sv = (o, k, u, d) => o ? fmt(o[k], d) + ' ' + u : '–';
    return '<section class="card"><div class="row between wrap" style="margin-bottom:12px"><div class="seg">' + [['t', 'Temperatur'], ['h', 'Luftfeuchte']].map(([k, l]) => '<button class="' + (S.chartKind === k ? 'on' : '') + '" data-a="ckind" data-v="' + k + '">' + l + '</button>').join('') + '</div><div class="seg">' + [['1', '24 Std.'], ['7', '7 Tage'], ['30', '30 Tage']].map(([k, l]) => '<button class="' + (S.chartRange === k ? 'on' : '') + '" data-a="crange" data-v="' + k + '">' + l + '</button>').join('') + '</div></div>' +
      chartSvg(t, rows, S.chartKind, from, to) +
      '<div class="readout" id="readout"><span class="xs">' + (inR.length ? 'Tippe auf das Diagramm für einzelne Werte. Grau = Nacht, grünes Band = Zielbereich.' : 'In diesem Zeitraum gibt es keine Messwerte.') + '</span></div></section>' +
      '<div class="stats"><div class="stat"><span class="xs">Messwerte</span><b>' + st.count + '</b></div><div class="stat"><span class="xs">Temperatur Ø</span><b>' + sv(st.temp, 'avg', '°C', 1) + '</b><span class="xs">' + (st.temp ? fmt(st.temp.min) + ' bis ' + fmt(st.temp.max) : '') + '</span></div><div class="stat"><span class="xs">Luftfeuchte Ø</span><b>' + sv(st.hum, 'avg', '%', 0) + '</b><span class="xs">' + (st.hum ? fmt(st.hum.min, 0) + ' bis ' + fmt(st.hum.max, 0) : '') + '</span></div><div class="stat"><span class="xs">Zeit im Ziel</span><b>' + (st.inRange.temp === null ? '–' : st.inRange.temp + ' %') + ' / ' + (st.inRange.hum === null ? '–' : st.inRange.hum + ' %') + '</b><span class="xs">Temp. / Feuchte</span></div></div>';
  }

  /* Einrichtung: Formular direkt im Reiter */
  function pfFrom(t) {
    const p = clone(t);
    for (const ph of ['day', 'night']) for (const k of ['temp', 'hum']) p[ph][k] = { min: numStr(t[ph][k].min, k === 'temp' ? 1 : 0), max: numStr(t[ph][k].max, k === 'temp' ? 1 : 0) };
    p.tol = Object.assign({}, TL.DEFAULT_TOL, t.tol);
    p.tolT = numStr(p.tol.tempOrange, 1); p.tolH = numStr(p.tol.humOrange, 0);
    const sz = t.size || {};
    p.size = { l: sz.l ?? '', b: sz.b ?? '', h: sz.h ?? '' };
    p.animalLen = t.animalLen ?? ''; p.count = t.count ?? 1; p.staleHours = t.staleHours ?? 24;
    return p;
  }
  function readPf() {
    const v = id => { const el = document.getElementById(id); return el ? el.value : null; };
    const p = clone(S.pf);
    const set = (path, id) => { const x = v(id); if (x !== null) path(x.trim()); };
    set(x => p.name = x, 'p-name'); set(x => p.species = x, 'p-species');
    set(x => p.size.l = x, 'p-l'); set(x => p.size.b = x, 'p-b'); set(x => p.size.h = x, 'p-h');
    set(x => p.animalLen = x, 'p-len'); set(x => p.count = x, 'p-count');
    set(x => p.dayStart = x, 'p-dayStart'); set(x => p.dayEnd = x, 'p-dayEnd');
    for (const ph of ['day', 'night']) for (const k of ['temp', 'hum']) { set(x => p[ph][k].min = x, 'p-' + ph + '-' + k + '-min'); set(x => p[ph][k].max = x, 'p-' + ph + '-' + k + '-max'); }
    set(x => p.tolT = x, 'p-tolT'); set(x => p.tolH = x, 'p-tolH'); set(x => p.staleHours = x, 'p-stale');
    return p;
  }
  function sizeHtml(p) {
    const rule = TL.SIZE_RULES[p.species];
    if (!rule) return '<div class="sizebox lv-none">Für diese Art kennt die App keine Mindestmaße.</div>';
    const m = TL.minSize(p.species, p.animalLen, p.count);
    if (!m) return '<div class="sizebox lv-none"><b>Mindestmaße</b><span>Trag die ' + (rule.basis === 'GL' ? 'Gesamtlänge' : 'Kopf-Rumpf-Länge') + ' deines größten Tieres ein, dann rechnet die App die Mindestmaße aus.</span></div>';
    const ck = TL.checkSize(p.species, p.size, p.animalLen, p.count);
    const mt = '<span>Mindestens <b class="num">' + m.l + ' × ' + m.b + ' × ' + m.h + ' cm</b> (L × T × H) für ' + esc(p.count) + (String(p.count) === '1' ? ' Tier' : ' Tiere') + '.</span>';
    if (!ck) return '<div class="sizebox lv-none"><b>Mindestmaße</b>' + mt + '<span>Trag die Maße deines Terrariums ein für den Vergleich.</span></div>';
    return '<div class="sizebox ' + (ck.ok ? 'lv-green' : 'lv-orange') + '"><b>' + (ck.ok ? 'Größe passt' : 'Terrarium kleiner als empfohlen') + '</b>' + mt + ck.issues.map(i => '<span>' + esc(i) + '</span>').join('') + '</div>';
  }
  function tabSetup(t) {
    if (!S.pf || S.pf.id !== t.id) { S.pf = pfFrom(t); S.errors = {}; }
    const p = S.pf, pr = TL.PRESETS[p.species], rule = TL.SIZE_RULES[p.species];
    const zin = (ph, k, which) => '<input class="num-in" inputmode="decimal" id="p-' + ph + '-' + k + '-' + which + '" value="' + esc(p[ph][k][which]) + '" aria-label="' + (ph === 'day' ? 'Tag' : 'Nacht') + ' ' + (k === 'temp' ? 'Temperatur' : 'Luftfeuchte') + ' ' + (which === 'min' ? 'min' : 'max') + '">';
    const zrow = (ph, k) => '<td>' + zin(ph, k, 'min') + '</td><td>' + zin(ph, k, 'max') + '</td>';
    const zerr = ['day.temp', 'day.hum', 'night.temp', 'night.hum'].filter(k => S.errors[k]).map(k => '<span class="ferr">' + (k.startsWith('day') ? 'Tag' : 'Nacht') + ', ' + (k.endsWith('temp') ? 'Temperatur' : 'Luftfeuchte') + ': ' + esc(S.errors[k]) + '</span>').join('');
    return '<form id="profile-form" class="form" novalidate><div class="grid g-2">' +
      '<fieldset><legend>Terrarium</legend><div class="f-grid"><label class="f' + ec('name') + '">Name<input id="p-name" value="' + esc(p.name) + '">' + err('name') + '</label>' +
      '<label class="f">Tierart<select id="p-species">' + Object.entries(TL.SPECIES).map(([k, s]) => '<option value="' + k + '"' + (p.species === k ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select></label></div>' +
      '<details' + (p.size.l || p.size.b || p.size.h || p.animalLen ? ' open' : '') + ' class="col" style="gap:12px"><summary class="sm" style="cursor:pointer;font-weight:600">Größe (freiwillig)</summary><span class="hint">Maße innen in Zentimetern</span><div class="f-grid3"><label class="f' + ec('size') + '">Länge<input class="num-in" inputmode="decimal" id="p-l" value="' + esc(p.size.l) + '" placeholder="cm"></label><label class="f' + ec('size') + '">Tiefe<input class="num-in" inputmode="decimal" id="p-b" value="' + esc(p.size.b) + '" placeholder="cm"></label><label class="f' + ec('size') + '">Höhe<input class="num-in" inputmode="decimal" id="p-h" value="' + esc(p.size.h) + '" placeholder="cm"></label></div>' + err('size') +
      '<div class="f-grid"><label class="f' + ec('animalLen') + '">' + (rule && rule.basis === 'KRL' ? 'Kopf-Rumpf-Länge größtes Tier' : 'Länge größtes Tier') + '<input class="num-in" inputmode="decimal" id="p-len" value="' + esc(p.animalLen) + '" placeholder="cm">' + err('animalLen') + '</label>' +
      '<label class="f' + ec('count') + '">Anzahl Tiere<input class="num-in" inputmode="numeric" id="p-count" value="' + esc(p.count) + '">' + err('count') + '</label></div>' +
      '<div id="size-check">' + sizeHtml(p) + '</div>' + (rule ? '<div class="src"><span>' + esc(rule.text) + '</span>' + srcLinks([rule.src]) + '</div>' : '') + '</details></fieldset>' +
      '<fieldset><legend>Zielwerte</legend>' + (pr ? '<div class="banner lv-green" style="padding:10px 12px"><span class="grow sm">Vorausgefüllt aus belegten Quellen für ' + esc(TL.SPECIES[p.species].name) + '. Du kannst jeden Wert ändern.</span><button type="button" class="btn sm" data-a="preset">Vorschlag neu eintragen</button></div>' : '') +
      '<div class="tbl-wrap"><table class="zt"><thead><tr><th></th><th>°C min</th><th>°C max</th><th>% min</th><th>% max</th></tr></thead><tbody>' +
      '<tr><td>Tag</td>' + zrow('day', 'temp') + zrow('day', 'hum') + '</tr><tr><td>Nacht</td>' + zrow('night', 'temp') + zrow('night', 'hum') + '</tr></tbody></table></div>' + zerr +
      (pr ? '<p class="xs">Hotspot: ' + esc(pr.hotspot) + '. Die App bewertet die Luft am Sensor, nicht den Sonnenplatz.</p>' : '') +
      '<div class="f-grid"><label class="f' + ec('dayStart') + '">Licht an (Tag beginnt)<input type="time" id="p-dayStart" value="' + esc(p.dayStart) + '">' + err('dayStart') + '</label><label class="f' + ec('dayEnd') + '">Licht aus (Nacht beginnt)<input type="time" id="p-dayEnd" value="' + esc(p.dayEnd) + '">' + err('dayEnd') + '</label></div>' +
      '<div class="f-grid3"><label class="f' + ec('tempOrange') + '">Orange bis ± °C<input class="num-in" inputmode="decimal" id="p-tolT" value="' + esc(p.tolT) + '">' + err('tempOrange') + '</label><label class="f' + ec('humOrange') + '">Orange bis ± %<input class="num-in" inputmode="decimal" id="p-tolH" value="' + esc(p.tolH) + '">' + err('humOrange') + '</label><label class="f' + ec('staleHours') + '">Wert alt nach Std.<input class="num-in" inputmode="numeric" id="p-stale" value="' + esc(p.staleHours) + '">' + err('staleHours') + '</label></div>' +
      '<span class="hint">Grün im Ziel, gelb knapp am Rand, orange leicht daneben, rot weiter daneben als die Orange-Grenze.</span>' +
      (pr ? '<div class="src"><b>Quellen</b>' + srcLinks(pr.sources) + pr.notes.map(n => '<span>' + esc(n) + '</span>').join('') + '</div>' : '') + '</fieldset></div>' +
      '<div class="row wrap"><button type="submit" class="btn pri">Einrichtung speichern</button><button type="button" class="btn" data-a="pfreset">Änderungen verwerfen</button><span class="grow"></span>' +
      (terrs().length > 1 ? (S.confirm === 'tdel' ? '' : '<button type="button" class="btn danger ghost" data-a="ask" data-v="tdel">' + icon('trash', 16) + 'Terrarium entfernen</button>') : '') + '</div>' +
      confirmBox('tdel', 'Terrarium mit seinen Lampen und Aufgaben entfernen? Messwerte bleiben im Backup.', 'tdel', t.id) + '</form>';
  }
  function lampSourceNote() {

  function checkResult() {

  /* Sensoren (nur im Supabase-Betrieb) */
  async function sensorCall(action) {
    const { data } = await sb.auth.getSession();
    const res = await fetch(SUPA.url + '/functions/v1/switchbot-poll?action=' + action, { headers: { Authorization: 'Bearer ' + data.session.access_token, apikey: SUPA.anonKey } });
    const body = await res.json().catch(() => ({ error: 'Keine Antwort' }));
    if (!res.ok || body.error) throw new Error(body.error || ('Fehler ' + res.status));
    return body;
  }

  function resizePhoto(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onerror = () => reject(new Error('Datei nicht lesbar'));
      r.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Kein Bild'));
        img.onload = () => {
          const max = 480, k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.8));
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  /* ================= Ereignisse ================= */

        break;

      case 'sldel': { const [d, pr] = v.split('|'); const cc = clone(cfg()); const t = cc.terrariums.find(x => x.id === S.tid); if (!t) break; const i = (t.subLog || []).findIndex(x => x.date === d && (x.product || '') === pr); if (i >= 0) t.subLog.splice(i, 1); saveConfig(cc); render(); break; }

        if (l.installed) l.log = (l.log || []).concat({ installed: l.installed, replaced: TL.isoDay(now()) }).slice(-20);
        l.installed = TL.isoDay(now()); saveConfig(cc);
        const info = TL.lampInfo(l, now());

      }
      case 'lnewform': S.edit = { id: '', tid: v || (S.lampFilter !== 'all' ? S.lampFilter : (terrs()[0] || {}).id), type: 'uvbT5', name: 'UV-B-Lampe', model: '', watt: '', installed: '', lifeMonths: TL.LAMP_TYPES.uvbT5.months, lifeHours: '', hoursPerDay: 12, log: [], pos: '', guard: null, uvbPct: '', night: false, fixture: '' }; S.errors = {}; openForm('lampform'); break;
      case 'ledit': { const l = lamps().find(x => x.id === v); if (l) { S.edit = clone(l); S.errors = {}; openForm('lampform'); } break; }
      case 'ldel': { const cc = c(); cc.lamps = cc.lamps.filter(x => x.id !== v); saveConfig(cc); toast('Lampe gelöscht'); goBack(); break; }

      case 'emtid': S.empf = { tid: v }; render(); break;
      case 'stid': S.subs = { tid: v }; render(); break;
      case 'skadd': { const cc = clone(cfg()); const t = cc.terrariums.find(x => x.id === (S.view === 'terr' ? S.tid : (S.empf || {}).tid)); if (!t) break; t.equip = Object.assign({}, t.equip); t.equip.sockets = readSockets(t).concat({ id: TL.uid('s'), name: '', kind: 'free', base: 'E27', role: 'any', ballast: null, ballastModel: '', ballastW: null, maxW: null, cage: false }); saveConfig(cc); render(); break; }
      case 'skdel': { const cc = clone(cfg()); const t = cc.terrariums.find(x => x.id === (S.view === 'terr' ? S.tid : (S.empf || {}).tid)); if (!t) break; const l = readSockets(t); l.splice(Number(v), 1); t.equip = Object.assign({}, t.equip, { sockets: l }); saveConfig(cc); render(); break; }
      case 'wtab': S.wissen = Object.assign(S.wissen || {}, { tab: v }); render(); break;
      case 'wtid': S.wissen = Object.assign(S.wissen || {}, { tid: v }); render(); break;
      case 'wsetup': { const w = S.wissen || {}; const cc = clone(cfg()); const t = cc.terrariums.find(x => x.id === w.tid); if (!t) break; t.setup = Object.assign({}, t.setup); if (t.setup[v]) delete t.setup[v]; else t.setup[v] = true; saveConfig(cc); render(); break; }
      case 'aphotodel': S.edit = Object.assign(readAnimalForm(), { photo: '' }); render(); break;
      case 'anew': S.edit = { id: '', name: '', tid: v || terrs()[0].id, sex: '', hatch: '', morph: '', origin: '', acquired: '', notes: '', photo: '' }; S.errors = {}; openForm('animalform'); break;
      case 'aedit': { const an = animals().find(x => x.id === v); if (an) { S.edit = clone(an); S.errors = {}; openForm('animalform'); } break; }
      case 'adel': { const cc = c(); cc.animals = cc.animals.filter(x => x.id !== v); saveConfig(cc); S.aid = null; S.edit = null; toast('Tier gelöscht'); go('animals'); break; }

          S.confirm = null; S.tid = terrs()[0].id; S.pf = null; toast('Alle Daten gelöscht'); go('dash');
        })();

    }
  });

  $app.addEventListener('input', ev => {

      if (id === 'e-t') S.entry.t = ev.target.value;
      else if (id === 'e-h') S.entry.h = ev.target.value;

      else if (id === 'e-n') S.entry.n = ev.target.value;

      const m = { 'c-tid': 'tid', 'c-type': 'type', 'c-brand': 'brand', 'c-model': 'model', 'c-watt': 'watt', 'c-pct': 'pct', 'c-fix': 'fix', 'c-pos': 'pos', 'c-guard': 'guard', 'c-rep': 'rep' };

      saveConfig(cc); toast(d ? 'Sensor „' + d.name + '“ zugeordnet' : 'Sensor entfernt'); render(); return;
    }

      const p = readPf(); const pr = TL.PRESETS[p.species];
      if (pr) for (const ph of ['day', 'night']) for (const k of ['temp', 'hum']) p[ph][k] = { min: String(pr[ph][k].min), max: String(pr[ph][k].max) };
      S.pf = p; S.errors = {}; render();

  $app.addEventListener('submit', ev => {
    ev.preventDefault();
    const id = ev.target.id;
    if (id === 'login-form') {
      const mail = document.getElementById('lg-mail').value.trim(), pw = document.getElementById('lg-pw').value;
      sb.auth.signInWithPassword({ email: mail, password: pw }).then(({ data, error }) => {
        if (error) { S.errors = { login: 'Anmeldung fehlgeschlagen: ' + error.message }; render(); return; }
        startSupa(data.session.user.id);
      });
      return;
    }
    if (id === 'entry-form') {
      const e = S.entry, ts = Date.parse(e.ts);
      const res = TL.validateReading({ t: e.t, h: e.h, ts: Number.isFinite(ts) ? ts : NaN }, now());
      S.errors = res.errors;
      if (!res.ok) { render(); return; }
      addReading(e.tid, res.value, e.n.trim());
      const a = TL.assessTerrarium(terr(e.tid), res.value, now());
      toast('Gespeichert · ' + TL.LEVEL_INFO[a.level].label);
      S.entry = null; goBack();
    } else if (id === 'profile-form') {
      const p = readPf();
      const res = TL.validateProfile(p);
      const tolT = TL.parseNum(p.tolT), tolH = TL.parseNum(p.tolH);
      if (tolT === null || tolT <= 0 || tolT > 20) res.errors.tempOrange = 'Bitte 0,1 bis 20 °C.';
      if (tolH === null || tolH <= 0 || tolH > 50) res.errors.humOrange = 'Bitte 1 bis 50 %.';
      S.errors = res.errors; S.pf = p;
      if (Object.keys(res.errors).length) { render(); const f = document.querySelector('.ferr'); if (f) f.scrollIntoView({ block: 'center' }); return; }
      const cc = clone(cfg());
      const i = cc.terrariums.findIndex(t => t.id === p.id);
      const old = cc.terrariums[i];
      const out = clone(p);
      delete out.tolT; delete out.tolH;
      for (const ph of ['day', 'night']) for (const k of ['temp', 'hum']) { const r = p[ph][k]; out[ph][k] = { min: TL.parseNum(r.min), max: TL.parseNum(r.max) }; }
      out.tol = Object.assign({}, TL.DEFAULT_TOL, old?.tol, { tempOrange: tolT, humOrange: tolH });
      out.staleHours = TL.parseNum(p.staleHours);
      out.size = { l: TL.parseNum(p.size.l), b: TL.parseNum(p.size.b), h: TL.parseNum(p.size.h) };
      out.animalLen = TL.parseNum(p.animalLen); out.count = TL.parseNum(p.count) || 1;
      const pr = TL.PRESETS[out.species];
      if (pr) out.source = 'Vorschlag: ' + pr.sources.map(k => TL.SOURCES[k].label).join('; ');
      let note = '';
      if (old && old.species !== out.species) {
        // Neue Art: unberührte Vorgaben (ohne Datum) durch die der neuen Art ersetzen
        cc.tasks = cc.tasks.filter(k => !(k.tid === out.id && k.preset && !k.last)).concat(TL.defaultTasksFor(out).filter(nk => !cc.tasks.some(k => k.tid === out.id && k.title === nk.title)));
        cc.lamps = (cc.lamps || []).filter(l => l.tid !== out.id || l.installed).concat((cc.lamps || []).some(l => l.tid === out.id && l.installed) ? [] : TL.defaultLampsFor(out));
        note = ' Aufgaben und Lampen an die Art angepasst.';
      }
      if (i >= 0) cc.terrariums[i] = out; else cc.terrariums.push(out);
      saveConfig(cc); S.pf = null; S.errors = {}; render(); toast('Einrichtung gespeichert.' + note);
    } else if (id === 'sock-form') {
      const g = x => (document.getElementById(x) || {}).value ?? '';
      const cc = clone(cfg()); const t = cc.terrariums.find(x => x.id === (S.view === 'terr' ? S.tid : (S.empf || {}).tid)); if (!t) return;
      t.equip = Object.assign({}, t.equip, { sockets: readSockets(t) });
      if (document.getElementById('sz-l')) t.size = { l: TL.parseNum(g('sz-l')), b: TL.parseNum(g('sz-b')), h: TL.parseNum(g('sz-h')) };
      saveConfig(cc); toast('Plätze gespeichert'); render();
    } else if (id === 'sublog-form') {
      const g = x => (document.getElementById(x) || {}).value ?? '';
      const date = g('sl-date'), ts = Date.parse(date);
      if (!Number.isFinite(ts) || ts > now() + TL.DAY) { toast('Bitte ein Datum wählen, das nicht in der Zukunft liegt.'); return; }
      const dep = g('sl-depth').trim() === '' ? null : TL.parseNum(g('sl-depth'));
      if (dep !== null && (dep <= 0 || dep > 100)) { toast('Bitte die Höhe in cm als Zahl eingeben.'); return; }
      const cc = clone(cfg()); const t = cc.terrariums.find(x => x.id === S.tid); if (!t) return;
      t.subLog = (t.subLog || []).concat({ date, product: g('sl-prod').trim(), depth: dep, note: g('sl-note').trim() });
      (cc.tasks || []).filter(k => k.tid === t.id && k.kind === 'soil').forEach(k => { if (!k.last || k.last < date) k.last = date; k.log = (k.log || []).concat(date).slice(-30); });
      saveConfig(cc); toast('Substrat eingetragen'); render();
    } else if (id === 'sub-form') {
      const g = x => (document.getElementById(x) || {}).value ?? '';
      const cc = clone(cfg()); const t = cc.terrariums.find(x => x.id === (S.subs || {}).tid); if (!t) return;
      t.size = Object.assign({ h: null }, t.size, { l: TL.parseNum(g('sb-l')), b: TL.parseNum(g('sb-b')) });
      const d = TL.parseNum(g('sb-d')); t.subDepth = d && d > 0 && d <= 100 ? d : null;
      saveConfig(cc); toast('Gespeichert'); render();
    } else if (id === 'equip-form') {
      const v = x => (document.getElementById(x) || {}).value ?? '';
      const cc = clone(cfg()); const t = cc.terrariums.find(x => x.id === S.tid); if (!t) return;
      const b = v('q-ballast');
      const n = x => { const m = parseInt(v(x), 10); return Number.isFinite(m) && m >= 0 && m <= 20 ? m : null; };
      t.equip = { sockets: t.equip && t.equip.sockets, covers: v('q-covers').trim(), ballast: b === '1' ? true : b === '0' ? false : null, notes: v('q-notes').trim() };
      const sl = { exo: n('q-slexo'), shade: n('q-slshade') };
      if (sl.exo !== null || sl.shade !== null) t.equip.slots = sl;
      saveConfig(cc); toast('Technik gespeichert'); render();
    } else if (id === 'task-form') {
      const k = Object.assign({}, S.edit, readTaskForm());
      const res = TL.validateTask(k);
      S.errors = res.errors; S.edit = k;
      if (!res.ok) { render(); return; }
      const cc = clone(cfg());
      k.every = TL.parseNum(k.every);
      const prev = cc.tasks.find(x => x.id === k.id);
      if (prev && (prev.every !== k.every || prev.title !== k.title)) k.preset = false;
      if (k.id) cc.tasks = cc.tasks.map(x => x.id === k.id ? k : x);
      else { k.id = TL.uid('k'); k.log = k.last ? [k.last] : []; k.preset = false; cc.tasks.push(k); }
      saveConfig(cc); toast('Aufgabe gespeichert'); goBack();
    } else if (id === 'lamp-form') {
      const l = readLampForm();
      const res = TL.validateLamp(l, now());
      if (l._age) { const inst = TL.installedFromAge(l._age, now()); if (!inst) res.errors.age = 'Bitte Monate als Zahl, zum Beispiel 7.'; else l.installed = inst; }
      if (l.uvbPct !== '' && l.uvbPct !== null) { const pc = TL.parseNum(l.uvbPct); if (pc === null || pc <= 0 || pc > 30) res.errors.uvbPct = 'Bitte Prozent als Zahl, zum Beispiel 12.'; }
      S.errors = res.errors; S.edit = l;
      if (Object.keys(res.errors).length) { render(); return; }
      const out = Object.assign({}, l, { watt: TL.parseNum(l.watt), uvbPct: TL.parseNum(l.uvbPct), lifeMonths: TL.parseNum(l.lifeMonths), lifeHours: TL.parseNum(l.lifeHours), hoursPerDay: TL.parseNum(l.hoursPerDay) });
      delete out._age;
      const cc = clone(cfg()); cc.lamps = cc.lamps || [];
      if (out.id) cc.lamps = cc.lamps.map(x => x.id === out.id ? out : x);
      else { out.id = TL.uid('l'); out.log = []; cc.lamps.push(out); }
      saveConfig(cc);
      const info = TL.lampInfo(out, now());
      const warnN = adviceOf(terr(out.tid)).filter(a => a.lid === out.id && TL.LEVELS.indexOf(a.level) >= TL.LEVELS.indexOf('yellow')).length;
      toast(warnN ? 'Gespeichert. Achtung: nicht optimal, schau dir die Hinweise an.' : info.dueAt ? 'Gespeichert. Tauschen am ' + dateLong(info.dueAt) + '.' : 'Gespeichert'); goBack();
    } else if (id === 'animal-form') {
      const v = x => (document.getElementById(x) || {}).value ?? '';
      const an = readAnimalForm();
      S.edit = an;
      if (!an.name) { S.errors = { name: 'Bitte einen Namen eingeben.' }; render(); return; }
      const cc = clone(cfg());
      if (an.id) cc.animals = cc.animals.map(x => x.id === an.id ? an : x);
      else { an.id = TL.uid('a'); cc.animals.push(an); }
      saveConfig(cc); toast('Gespeichert'); S.aid = an.id; S.edit = null; S.back = null; go('animals');
    } else if (id === 'journal-form') {
      const v = x => (document.getElementById(x) || {}).value ?? '';
      const e = Object.assign({}, S.edit, { ts: v('j-ts'), value: v('j-value'), note: v('j-note').trim() });
      const res = TL.validateJournal(e, now());
      S.errors = res.errors; S.edit = e;
      if (!res.ok) { render(); return; }
      const d = new Date(e.ts + 'T12:00:00');
      addJournal({ id: TL.uid('j'), aid: S.aid, type: e.type, ts: d.getTime(), value: e.type === 'weight' ? TL.parseNum(e.value) : '', note: e.note });
      S.edit = null; S.errors = {}; toast('Eingetragen'); render();
    }
  });

  document.addEventListener('focusout', () => { setTimeout(() => { if (S.pendingRender) softRender(); }, 150); });

  /* ================= Start ================= */
  applyTheme(getTheme());
  function startSupa(uid) { S.errors = {}; Store.loadSupa(uid).then(boot); }
  function boot() {
    const added = prepareConfig();
    S.tid = terrs()[0].id;
    S.ready = true; bump();
    render();
    if (S.movedLocal) toast('Deine bisherigen Daten wurden in dein Konto übernommen.');
    else if (added) toast('Zielwerte, Aufgaben und Lampen wurden ergänzt.');
  }
  Store.init().then(() => { if (Store.mode === 'login') render(); else boot(); });
})();
</script>
